name: Weekly GA Weight Optimization

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      generations:
        description: 'Number of generations'
        required: false
        default: '50'
      population:
        description: 'Population size'
        required: false
        default: '100'

jobs:
  optimize:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 🔥 push 권한 필수

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run GA Optimization
        run: |
          uv run python -m lottogogo.tuning.ga_optimizer \
            --generations "${{ github.event.inputs.generations || '50' }}" \
            --population "${{ github.event.inputs.population || '100' }}" \
            --jobs 4 \
            --output data/optimized_weights.json \
            --plot data/fitness_history.png \
            --cycle-label "auto-optimization-${{ github.sha }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/optimized_weights.json data/fitness_history.png

          git diff --cached --quiet || git commit -m "chore: update optimized weights [skip ci]"

          git push

      - name: Discord 알림 (GA 최적화 완료)
        run: |
          FITNESS=$(python -c "import json; d=json.load(open('data/optimized_weights.json')); f=d['fitness']; print(f'val={f[\"val_fitness\"]:.3f} / train={f[\"train_fitness\"]:.3f}')")
          curl -s -X POST "https://discord.com/api/webhooks/1489697563367051436/FcCKJ394R1VqN7sPxqwJydvJ2Ll4YLGSGERoY6inGzgwOZBmQu5_nppUjOlYxJE8S7Hv" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🧬 **GA 가중치 최적화 완료**\n📈 fitness: ${FITNESS}\"}"